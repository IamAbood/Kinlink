[package]
name = "pclone"
version = "0.29.8-beta"
license = "MIT"
authors = ["Abdulkareem Alsaou"]
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
arboard = "3.7.0"
bincode = "1"
chacha20poly1305 = "0.11.0"
cpal = "0.18.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
gilrs = "0.11.2"
hidapi = "2.6.7"
igd-next = { version = "0.18.0", features = ["ipv6"] }
openh264 = "0.9.10"
openh264-sys2 = "0.9.10"
png = "0.18.1"
pollster = "1.0.3"
rand = "0.10.4"
rumqttc = "0.25.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
tray-icon = "0.26.1"
unicode-bidi = "0.3"
ureq = "3.5.2"
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }
webpki-roots = "1.0.12"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Media_MediaFoundation", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Security_Cryptography", "UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_StationsAndDesktops", "Win32_System_IO", "Win32_Globalization", "Win32_System_DataExchange", "ApplicationModel", "ApplicationModel_Activation", "Win32_Storage_Packaging_Appx"] }
windows-core = "0.62"
windows-service = "0.8.1"
winit = "0.30"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[build-dependencies]
winresource = "0.1.34"

# Vendored with DualShock 4 rumble notifications added (see vendor/vigem-client/src/ds4.rs).
[patch.crates-io]
vigem-client = { path = "vendor/vigem-client" }
