[package]
name = "pclone-android"
version = "0.23.3-beta"
license = "MIT"
authors = ["Abdulkareem Alsaou"]
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# The engine (crypto, friends, protocol, client, decoder, renderer) is shared with the Windows
# app: see the #[path] modules in src/lib.rs.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.2"
bincode = "1"
rand = "0.10"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
rumqttc = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1"
openh264 = "0.9.10"
unicode-bidi = "0.3"
openh264-sys2 = "0.9.10"
cpal = "0.18"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false }
egui-wgpu = "0.37"
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "1"
log = "0.4"
jni = "0.22"
ndk-context = "0.1"
android_logger = "0.15"

[package.metadata.android]
package = "com.parsecclone.app"
apk_name = "Kinlink"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[package.metadata.android.application]
label = "Kinlink"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"
orientation = "unspecified"

# Release signing: set CARGO_APK_RELEASE_KEYSTORE / CARGO_APK_RELEASE_KEYSTORE_PASSWORD (see scripts/build-android.sh).
